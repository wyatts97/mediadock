# docker-compose.cpu.yml — CPU-only override (no GPU)
# Usage: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d

services:
  ai-vision:
    deploy: {}     # removes NVIDIA GPU reservation

  processor:
    build:
      dockerfile: Dockerfile.cpu
    deploy: {}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AI_VISION_URL=http://ai-vision:11434
      - LLAVA_MODEL=llava:7b     # use smaller model on CPU
