# docker-compose.gpu.yml — NVIDIA GPU passthrough override
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  ai-vision:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  processor:
    build:
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
